name: Build & Deploy

on:
  push:
    branches: [dev, production]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set deployment environment
        run: |
          if [ "${GITHUB_REF_NAME}" = "production" ]; then
            echo "DEPLOY_ENV=production" >> "$GITHUB_ENV"
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
            echo "DEPLOY_PATH=/srv/services/services/reportx/production" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "DEPLOY_ENV=dev" >> "$GITHUB_ENV"
            echo "IMAGE_TAG=dev" >> "$GITHUB_ENV"
            echo "DEPLOY_PATH=/srv/services/services/reportx/dev" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/aimagelab-zip/reportx:${{ env.IMAGE_TAG }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_PATH
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd "$DEPLOY_PATH"
            docker compose pull
            docker compose up -d
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}